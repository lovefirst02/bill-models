[project]
name = "bill-models"
version = "1.0.0"
description = "Training for the text detector and reader of Taipower bills, on synthetic data only"
requires-python = ">=3.10,<3.14"
dependencies = [
  # The labels the reader must know and the detector's settings live with the code that uses them.
  "taipower-bill-ocr @ git+https://github.com/lovefirst02/taipower-bill-ocr@v0.25.0-docs",
  "numpy",
  "opencv-python-headless",
  "onnx",
  "onnxruntime",
  "Pillow",
  "torch>=2.5",
]

[tool.uv]
package = false
